# Release builds for Espresso Cash.
#
# Signing is loaded from secret env variables (not from the Codemagic UI), so the whole
# setup can be managed through the Codemagic API. Required variable groups:
#
#   common          dart-define values (see the "Prepare dart defines" script)
#   android_signing CM_KEYSTORE (base64 .jks), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
#   google_play     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (service account JSON)
#   app_store       APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
#                   APP_STORE_CONNECT_PRIVATE_KEY (.p8 contents), CERTIFICATE_PRIVATE_KEY,
#                   APP_STORE_APPLE_ID (numeric Apple ID of the app)
#
# The release workflows run on a pushed `v*` tag, or manually from the Codemagic UI / API.

definitions:
  triggering: &release_trigger
    events:
      - tag
    tag_patterns:
      - pattern: "v*"
        include: true

  scripts:
    - &prepare_dart_defines
      name: Prepare dart defines
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        DEFINES_FILE="$CM_BUILD_DIR/dart_defines.txt"
        : > "$DEFINES_FILE"
        for name in SOLANA_RPC_URL SOLANA_WEBSOCKET_URL SENTRY_DSN RAMP_API_KEY KADO_API_KEY \
          GUARDARIAN_API_KEY INTERCOM_APP_ID INTERCOM_IOS_KEY INTERCOM_ANDROID_KEY \
          MIXPANEL_TOKEN SOROBAN_RPC_URL BRIJ_API_KEY; do
          if [ -z "${!name:-}" ]; then
            echo "Missing env variable: $name" >&2
            exit 1
          fi
          echo "--dart-define=$name=${!name}" >> "$DEFINES_FILE"
        done
        echo "--dart-define=PROD=true" >> "$DEFINES_FILE"
        echo "--dart-define=STELLAR_PROD=true" >> "$DEFINES_FILE"
    - &android_local_properties
      name: Set up local.properties
      script: echo "flutter.sdk=$HOME/programs/flutter" > "android/local.properties"
    - &android_keystore
      name: Set up keystore
      script: |
        echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/upload.jks"
        echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/upload.jks" >> "$CM_ENV"
    - &get_packages
      name: Get Flutter packages
      script: flutter packages pub get
    - &generate_code
      name: Generate code
      script: dart run build_runner build --delete-conflicting-outputs

workflows:
  android-release:
    name: Android release
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: packages/espressocash_app
    environment:
      groups:
        - common
        - android_signing
        - google_play
      flutter: 3.38.3
      java: 17
      vars:
        PACKAGE_NAME: com.pleasecrypto.flutter
    triggering: *release_trigger

    scripts:
      - *android_local_properties
      - *android_keystore
      - *prepare_dart_defines
      - *get_packages
      - *generate_code
      - name: Build AAB with Flutter
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME")
          BUILD_NUMBER=$((LATEST + 1))
          echo "Latest Google Play build number: $LATEST, building $BUILD_NUMBER"
          DART_DEFINES=()
          while IFS= read -r line; do DART_DEFINES+=("$line"); done < "$CM_BUILD_DIR/dart_defines.txt"
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            "${DART_DEFINES[@]}"

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
        submit_as_draft: false

  # Signed AAB without Google Play access (no upload). Start it manually and pass
  # ANDROID_BUILD_NUMBER, which must be higher than the latest build on Google Play.
  android-build:
    name: Android build (no upload)
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: packages/espressocash_app
    environment:
      groups:
        - common
        - android_signing
      flutter: 3.38.3
      java: 17

    scripts:
      - *android_local_properties
      - *android_keystore
      - *prepare_dart_defines
      - *get_packages
      - *generate_code
      - name: Build AAB with Flutter
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -z "${ANDROID_BUILD_NUMBER:-}" ]; then
            echo "Set ANDROID_BUILD_NUMBER when starting this workflow" >&2
            exit 1
          fi
          DART_DEFINES=()
          while IFS= read -r line; do DART_DEFINES+=("$line"); done < "$CM_BUILD_DIR/dart_defines.txt"
          flutter build appbundle --release \
            --build-number="$ANDROID_BUILD_NUMBER" \
            "${DART_DEFINES[@]}"

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

  ios-release:
    name: iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: packages/espressocash_app
    environment:
      groups:
        - common
        - app_store
      flutter: 3.38.3
      # App Store uploads must be built with the iOS 26 SDK.
      xcode: latest
      cocoapods: 1.16.2
      vars:
        BUNDLE_ID: com.pleasecrypto.flutter
    triggering: *release_trigger

    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - *prepare_dart_defines
      - *get_packages
      - *generate_code
      - name: Build IPA with Flutter
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          BUILD_NUMBER=$((LATEST + 1))
          echo "Latest TestFlight build number: $LATEST, building $BUILD_NUMBER"
          DART_DEFINES=()
          while IFS= read -r line; do DART_DEFINES+=("$line"); done < "$CM_BUILD_DIR/dart_defines.txt"
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number="$BUILD_NUMBER" \
            "${DART_DEFINES[@]}"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
